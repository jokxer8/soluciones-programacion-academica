<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Anatomía de una red</title><desc id="desc">Mapa con tres componentes de red y tres ejemplos de alcance.</desc><rect width="1000" height="470" fill="#f8f7f1"/><rect width="1000" height="104" fill="#10233a"/><text x="28" y="32" fill="#b3e3d4" font-family="sans-serif" font-size="14" font-weight="700">JOKXER / FUNDAMENTOS DE REDES</text><text x="28" y="76" fill="#ffffff" font-family="sans-serif" font-size="35" font-weight="700">Anatomía de una red</text><rect y="101" width="1000" height="4" fill="#126a61"/><rect x="28" y="161" width="304" height="112" rx="11" fill="#dcefe8"/><text x="43" y="191" fill="#10233a" font-family="sans-serif" font-size="20" font-weight="bold">01 · Host</text><text x="43" y="220" fill="#213d4b" font-family="sans-serif" font-size="15">Origina o recibe datos.</text><text x="43" y="243" fill="#213d4b" font-family="sans-serif" font-size="15">Ejemplo: una portátil.</text><rect x="348" y="161" width="304" height="112" rx="11" fill="#dcefe8"/><text x="363" y="191" fill="#10233a" font-family="sans-serif" font-size="20" font-weight="bold">02 · Medio</text><text x="363" y="220" fill="#213d4b" font-family="sans-serif" font-size="15">Transporta la señal.</text><text x="363" y="243" fill="#213d4b" font-family="sans-serif" font-size="15">Ejemplo: cable, fibra o Wi-Fi.</text><rect x="668" y="161" width="304" height="112" rx="11" fill="#dcefe8"/><text x="683" y="191" fill="#10233a" font-family="sans-serif" font-size="20" font-weight="bold">03 · Intermediario</text><text x="683" y="220" fill="#213d4b" font-family="sans-serif" font-size="15">Conecta equipos o redes.</text><text x="683" y="243" fill="#213d4b" font-family="sans-serif" font-size="15">Ejemplo: un switch o router.</text><rect x="28" y="300" width="304" height="112" rx="11" fill="#e1eaf2"/><text x="43" y="330" fill="#10233a" font-family="sans-serif" font-size="20" font-weight="bold">LAN</text><text x="43" y="359" fill="#213d4b" font-family="sans-serif" font-size="15">Conecta un espacio local.</text><text x="43" y="382" fill="#213d4b" font-family="sans-serif" font-size="15">Ejemplo: un aula.</text><rect x="348" y="300" width="304" height="112" rx="11" fill="#e1eaf2"/><text x="363" y="330" fill="#10233a" font-family="sans-serif" font-size="20" font-weight="bold">WAN</text><text x="363" y="359" fill="#213d4b" font-family="sans-serif" font-size="15">Une redes a distancia.</text><text x="363" y="382" fill="#213d4b" font-family="sans-serif" font-size="15">Ejemplo: dos sedes.</text><rect x="668" y="300" width="304" height="112" rx="11" fill="#e1eaf2"/><text x="683" y="330" fill="#10233a" font-family="sans-serif" font-size="20" font-weight="bold">Internet</text><text x="683" y="359" fill="#213d4b" font-family="sans-serif" font-size="15">Interconecta redes a escala mundial.</text><text x="683" y="382" fill="#213d4b" font-family="sans-serif" font-size="15">Ejemplo: acceso a un portal público.</text><text x="28" y="145" fill="#126a61" font-family="sans-serif" font-size="14" font-weight="bold">COMPONENTES</text><text x="28" y="291" fill="#126a61" font-family="sans-serif" font-size="14" font-weight="bold">ALCANCE</text><text x="28" y="443" fill="#213d4b" font-family="sans-serif" font-size="13">Adaptación del mapa de clase de Kelvin César Del Castillo Torres.</text></svg>
