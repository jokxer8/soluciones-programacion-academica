<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCP y UDP en acción</title>
<style>
:root{
  --ink:#0a2136; --panel:#10304d; --panel2:#163d60; --line:#2a587f;
  --text:#eaf2f9; --mut:#a3bbd0;
  --tcp:#4cc9f0; --udp:#f6b93b; --bad:#ff7a6e; --ok:#4ade9a;
  --head:Bahnschrift,"DIN Alternate","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#061524;color:var(--text);font-family:var(--body);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;background:var(--ink);transform-origin:center;overflow:hidden}
.slide{position:absolute;inset:0;padding:56px 64px 84px;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s}
.slide.on{opacity:1;visibility:visible;transition:opacity .35s ease}
.cols{display:grid;grid-template-columns:500px 1fr;gap:44px;height:100%}
.where{font-family:var(--mono);font-size:16px;color:var(--mut);margin:0 0 14px}
.where b{color:var(--c);font-weight:600;margin-right:10px}
h1,h2{font-family:var(--head);font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:37px;line-height:1.14;text-wrap:balance}
.pts{list-style:none;padding:0;margin:30px 0 0}
.pts li{font-size:20.5px;line-height:1.42;padding:0 0 0 26px;margin:0 0 18px;position:relative;color:#d6e4f0}
.pts li::before{content:"";position:absolute;left:0;top:.52em;width:10px;height:10px;border-radius:2px;background:var(--c)}
.w{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:16px;min-width:0}
.tcp{--c:var(--tcp)} .udp{--c:var(--udp)} .ok{--c:var(--ok)}

/* controles */
.b{font:600 17px var(--body);color:var(--ink);background:var(--c);border:0;border-radius:9px;padding:11px 18px;cursor:pointer;transition:transform .12s ease,filter .12s ease}
.b:hover{filter:brightness(1.1)} .b:active{transform:scale(.97)}
.b:disabled{opacity:.4;cursor:default}
.b.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.msg{font-size:18.5px;line-height:1.4;margin:0;min-height:52px;color:var(--text)}
.msg.bad{color:var(--bad)} .msg.good{color:var(--ok)}
.cap{font-size:15px;color:var(--mut);margin:0}
.grow{flex:1;min-height:0}
.mono{font-family:var(--mono)}

/* puertos */
.ports{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.port{font:inherit;color:var(--text);background:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:18px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .2s,background .2s,transform .12s}
.port:active{transform:scale(.97)}
.port .pn{font:600 30px var(--mono)}
.port .st{font-size:14px;color:var(--mut)}
.port[aria-pressed=true]{border-color:var(--ok);background:#0f3a3a}
.port[aria-pressed=true] .st{color:var(--ok)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}

/* diagrama de secuencia */
svg.seq{width:100%;flex:1;min-height:0}
.seq text{fill:var(--text);font-family:var(--body)}
.seq .life{stroke:var(--line);stroke-width:2;stroke-dasharray:5 6}
.seq .hd{fill:var(--ink);stroke:var(--line);stroke-width:1.5}
.seq .ar{stroke:var(--c);stroke-width:3.5;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease forwards}
.seq .tip{fill:var(--c);opacity:0;animation:pop .2s .6s forwards}
.seq .lb{opacity:0;animation:pop .3s .25s forwards}
.seq .et{font:600 21px var(--mono);fill:var(--c)}
.seq .sub{font:15px var(--mono);fill:var(--mut)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}

/* bits de control */
.bits{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.bit{font:600 22px var(--mono);color:var(--text);background:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:22px 0;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.bit[aria-pressed=true]{background:var(--c);color:var(--ink);border-color:var(--c)}
.big{font:600 44px var(--head);color:var(--c);margin:0}

/* segmentos */
.track{position:relative;height:74px}
.seg{position:absolute;top:0;width:78px;height:74px;border-radius:10px;background:var(--ink);border:1.5px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:left .7s cubic-bezier(.3,1.2,.4,1)}
.seg b{font:600 20px var(--mono);color:var(--c)}
.seg span{font:13px var(--mono);color:var(--mut)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.cell{font:600 19px var(--mono);height:54px;border-radius:9px;border:1.5px solid var(--line);background:var(--ink);color:var(--text);display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s,color .25s,opacity .25s}
button.cell{cursor:pointer}
.cell.lost{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.cell.re{background:var(--c);border-color:var(--c);color:var(--ink)}
.cell.off{opacity:.25}
.cell.in{animation:drop .35s ease both}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}}
.sw{display:inline-flex;border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.sw button{font:600 16px var(--body);background:transparent;color:var(--text);border:0;padding:10px 16px;cursor:pointer}
.sw button[aria-pressed=true]{background:var(--c);color:var(--ink)}

/* ventana */
input[type=range]{width:100%;accent-color:var(--tcp);height:28px}
.lane{position:relative;height:120px;border-radius:12px;background:var(--ink);border:1.5px solid var(--line);overflow:hidden}
.lane .end{position:absolute;top:0;bottom:0;width:92px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;background:var(--panel2)}
.lane .end.r{right:0}
.pk{position:absolute;left:100px;top:28px;width:26px;height:26px;border-radius:6px;background:var(--tcp);opacity:0}
.pk.ack{top:72px;left:auto;right:100px;width:auto;height:auto;padding:3px 9px;font:600 14px var(--mono);color:var(--ink);background:var(--ok)}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.stat div{background:var(--ink);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:600 27px var(--mono);color:var(--c)}
.stat span{font-size:14px;color:var(--mut)}

/* MSS */
.mtu{display:flex;height:96px;border-radius:12px;overflow:hidden;font-weight:600}
.mtu div{display:flex;flex-direction:column;align-items:center;justify-content:center;transition:flex-basis .5s ease;font-size:16px;text-align:center;line-height:1.25}
.mtu b{font:600 22px var(--mono)}
.mtu .ip{background:#3b6fa0;flex:0 0 110px} .mtu .ip.v6{flex-basis:190px}
.mtu .th{background:#2d8fb3;flex:0 0 110px}
.mtu .da{background:var(--tcp);color:var(--ink);flex:1}
.brace{border:1.5px solid var(--mut);border-bottom:0;height:12px;border-radius:8px 8px 0 0}

/* congestión */
svg.cg{width:100%;flex:1;min-height:0}
.cg polyline{fill:none;stroke:var(--tcp);stroke-width:3.5;stroke-linejoin:round}
.cg .ax{stroke:var(--line);stroke-width:1.5}
.cg text{fill:var(--mut);font:14px var(--body)}
.cg circle{fill:var(--bad)}

/* encabezados */
.hdr{display:grid;grid-template-columns:repeat(32,1fr);gap:4px}
.hdr button{font:600 14px var(--body);color:var(--text);background:var(--ink);border:1.5px solid var(--c);border-radius:6px;height:38px;cursor:pointer;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .2s,color .2s}
.hdr button[aria-pressed=true]{background:var(--c);color:var(--ink)}
.hh{display:flex;justify-content:space-between;align-items:baseline;margin:0}
.hh b{font:600 20px var(--head)} .hh span{font:600 20px var(--mono);color:var(--c)}

/* aplicaciones y tabla */
.card{background:var(--ink);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{font:600 15px var(--mono);border:1.5px solid var(--c);color:var(--c);border-radius:999px;padding:5px 12px;animation:drop .35s ease both}
table{border-collapse:collapse;width:100%;font-size:18px}
th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line)}
th{font:600 20px var(--head)} td:first-child{color:var(--mut);font-size:16px}
th:nth-child(2),td:nth-child(2){color:var(--tcp)} th:nth-child(3),td:nth-child(3){color:var(--udp)}
tr:last-child td{border-bottom:0}

/* portada, agenda, cuestionario, cierre */
.cover{display:flex;flex-direction:column;justify-content:center;height:100%}
.cover h1{font-size:104px;line-height:.98;letter-spacing:-.025em;max-width:900px}
.cover .tcpw{color:var(--tcp)} .cover .udpw{color:var(--udp)}
.cover p{font-size:24px;color:var(--mut);margin:26px 0 0}
.who{font-size:19px;margin-top:10px;color:var(--text)}
.gente{display:flex;gap:36px;margin-top:22px}
.gente div{display:flex;align-items:center;gap:14px;font-size:19px;line-height:1.3}
.gente img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.gente small{display:block;font:14px var(--mono);color:var(--mut)}
.wire{position:absolute;left:64px;right:64px;bottom:150px;height:2px;background:var(--line)}
.wire::before,.wire::after{content:"";position:absolute;top:-9px;width:20px;height:20px;border-radius:50%;background:var(--ink);border:2px solid var(--mut)}
.wire::before{left:-10px} .wire::after{right:-10px}
.wire i{position:absolute;top:-17px;font:600 15px var(--mono);font-style:normal;color:var(--ink);background:var(--tcp);padding:6px 12px;border-radius:7px;opacity:0;animation:9s linear infinite}
.wire i:nth-child(1){animation-name:toR}
.wire i:nth-child(2){animation-name:toL;animation-delay:3s}
.wire i:nth-child(3){animation-name:toR;animation-delay:6s}
@keyframes toR{0%{left:2%;opacity:0}3%{opacity:1}30%{left:88%;opacity:1}33%,100%{left:88%;opacity:0}}
@keyframes toL{0%{left:86%;opacity:0}3%{opacity:1}30%{left:2%;opacity:1}33%,100%{left:2%;opacity:0}}
.agenda{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
.agenda button{font:inherit;text-align:left;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 28px;cursor:pointer;transition:background .2s,transform .12s}
.agenda button:hover{background:var(--panel2)} .agenda button:active{transform:scale(.985)}
.agenda b{font:600 40px var(--mono);color:var(--c);display:block}
.agenda span{font:600 25px var(--head);display:block;margin-top:6px}
.agenda small{font-size:16px;color:var(--mut);display:block;margin-top:8px}
.quiz{max-width:980px;margin:22px auto 0;display:flex;flex-direction:column;gap:16px}
.quiz h3{font:600 30px var(--head);margin:0;line-height:1.2;min-height:72px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:500 20px var(--body);text-align:left;color:var(--text);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:18px 20px;cursor:pointer;transition:background .2s,border-color .2s}
.opt:hover:not(:disabled){background:var(--panel2)}
.opt.yes{border-color:var(--ok);background:#0f3a3a} .opt.no{border-color:var(--bad);background:#3a1f26}
.opt:disabled{cursor:default}
.fin{display:flex;flex-direction:column;justify-content:center;height:100%}
.fin h2{font-size:92px}
.fin p{font-size:26px;color:var(--mut);max-width:820px;line-height:1.4}

/* barra inferior: el progreso es un paquete que recorre el cable */
#bar{position:absolute;left:64px;right:64px;bottom:26px;display:flex;align-items:center;gap:18px;font:15px var(--mono);color:var(--mut)}
#cable{flex:1;height:2px;background:var(--line);position:relative}
#dot{position:absolute;top:-5px;width:12px;height:12px;border-radius:3px;background:var(--tcp);margin-left:-6px;transition:left .45s ease}
#bar button{font:600 18px var(--body);width:38px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
#bar button:hover{background:var(--panel)}

/* paneles fuera del escenario */
#notes{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;background:#04101cf2;border-top:2px solid var(--tcp);padding:18px 28px;font-size:19px;line-height:1.5;display:none;z-index:5}
#notes.on{display:block} #notes em{display:block;margin-top:10px;color:var(--udp);font-style:normal}
#index{position:fixed;inset:0;background:#04101cf5;display:none;z-index:6;overflow:auto;padding:40px}
#index.on{display:block}
#index h2{margin-bottom:20px}
#index ol{columns:2;column-gap:40px;max-width:1100px;margin:0 auto;padding-left:28px;font-size:18px}
#index li{margin:0 0 6px;break-inside:avoid}
#index button{font:inherit;color:var(--text);background:none;border:0;text-align:left;cursor:pointer;padding:6px 8px;border-radius:6px}
#index button:hover{background:var(--panel)}
#help{position:fixed;right:14px;top:10px;font:13px var(--body);color:#7f9ab3;z-index:4}
</style>
</head>
<body>
<div id="stage">
  <div id="bar">
    <span id="sec"></span><div id="cable"><div id="dot"></div></div><span id="count"></span>
    <button type="button" id="prev" aria-label="Diapositiva anterior">&#8249;</button>
    <button type="button" id="next" aria-label="Diapositiva siguiente">&#8250;</button>
  </div>
</div>
<div id="help">← → avanzar · N guion · G índice · F pantalla completa</div>
<div id="notes" aria-live="polite"></div>
<div id="index"><h2>Índice</h2><ol></ol></div>
<script>
const D = {"meta":{"titulo":"TCP y UDP en acción","subtitulo":"Capa de transporte, módulo 14: temas 14.5 a 14.8","curso":"CSD-1930-1087 Fundamentos de Redes","equipo":"ColomboCubano","expositores":[{"nombre":"Gabriel Galasso","matricula":"[dato retirado]","foto":"gabriel"},{"nombre":"Kelvin Del Castillo","matricula":"[dato retirado]","foto":"kelvin"}],"autores":"Gabriel Galasso y Kelvin Del Castillo","fecha":"Noviembre de 2026"},"secciones":[{"id":"14.5","nombre":"Proceso de comunicación TCP","color":"tcp"},{"id":"14.6","nombre":"Confiabilidad y control de flujo","color":"tcp"},{"id":"14.7","nombre":"Comunicación UDP","color":"udp"},{"id":"14.8","nombre":"Práctica del módulo y cuestionario","color":"ok"}],"slides":[{"tipo":"portada","sec":null,"min":1,"titulo":"TCP y UDP en acción","notas":"Buenos días. Somos Gabriel Galasso y Kelvin Del Castillo, y hoy vamos a explicar cómo trabajan TCP y UDP, los dos protocolos de la capa de transporte. Vamos a ver cómo TCP abre y cierra una conversación, cómo garantiza que los datos lleguen completos y en orden, y por qué UDP renuncia a todo eso a cambio de velocidad. La presentación es interactiva: cada tema tiene una demostración que iremos manejando en vivo.","accion":"Avanzar con la flecha derecha o la barra espaciadora.","expone":"Gabriel Galasso"},{"tipo":"agenda","sec":null,"min":1,"titulo":"Qué vamos a ver","notas":"El recorrido tiene cuatro partes. Primero, el proceso de comunicación de TCP: puertos del servidor, el enlace de tres vías y el cierre de sesión. Segundo, la confiabilidad y el control de flujo: números de secuencia, retransmisión, ventana, MSS y congestión. Tercero, UDP y por qué es más liviano. Y al final, lo que se observa en la práctica de Packet Tracer, un resumen y un cuestionario corto para comprobar lo aprendido.","accion":"Cada tarjeta lleva directo a su sección; no hace falta pulsarlas.","expone":"Gabriel Galasso"},{"sec":"14.5","num":"14.5.1","min":1.5,"widget":"ports","titulo":"Cada servicio del servidor escucha en su propio puerto","puntos":["Un servidor ejecuta varios servicios a la vez; cada uno se identifica por un número de puerto.","Dos servicios no pueden usar el mismo puerto dentro del mismo protocolo de transporte.","Un puerto con una aplicación activa asignada está abierto: la capa de transporte acepta segmentos dirigidos a él."],"notas":"Un mismo servidor puede atender páginas web, correo y transferencia de archivos al mismo tiempo. ¿Cómo sabe a cuál aplicación entregar cada segmento? Por el número de puerto de destino. Cada servicio activo se registra en un puerto: HTTP en el 80, HTTPS en el 443, FTP en el 21, SMTP en el 25. Ese puerto queda abierto, es decir, el servidor acepta segmentos dirigidos a él. La regla importante es que dos servicios no pueden compartir el mismo puerto en el mismo protocolo de transporte. Si intento levantar un segundo servidor web en el puerto 80, el sistema lo rechaza.","accion":"Encender HTTP y FTP. Luego pulsar «Iniciar un segundo servidor web en el 80» para mostrar el rechazo.","expone":"Gabriel Galasso"},{"sec":"14.5","num":"14.5.2","min":2,"widget":"handshake","titulo":"TCP abre la conexión con un enlace de tres vías","puntos":["Paso 1: el cliente pide una sesión de cliente a servidor con un segmento SYN.","Paso 2: el servidor confirma con ACK y pide su propia sesión de servidor a cliente con SYN.","Paso 3: el cliente confirma con ACK. La conexión queda establecida en ambos sentidos."],"notas":"Antes de enviar un solo byte de datos, TCP establece la conexión. Lo hace en tres pasos. Primero, el cliente envía un segmento con el indicador SYN y su número de secuencia inicial; aquí es 100. Segundo, el servidor responde con dos cosas en un mismo segmento: ACK igual a 101, que confirma que recibió el SYN, y su propio SYN con su número de secuencia inicial, 300. Tercero, el cliente confirma con ACK igual a 301. Fíjense que el acuse siempre es el número recibido más uno: indica el próximo byte que se espera. A partir de aquí la conexión es bidireccional y ya pueden viajar los datos.","accion":"Pulsar «Siguiente paso» tres veces, narrando cada flecha.","expone":"Gabriel Galasso"},{"sec":"14.5","num":"14.5.3","min":1.5,"widget":"termination","titulo":"Cerrar la sesión toma cuatro pasos, dos por cada sentido","puntos":["Quien ya no tiene datos que enviar manda un segmento con el indicador FIN.","El otro extremo confirma con ACK: ese sentido de la conversación queda cerrado.","El proceso se repite en el sentido contrario: FIN del servidor y ACK del cliente."],"notas":"Una conexión TCP son en realidad dos sesiones unidireccionales, y cada una se cierra por separado. Cuando el cliente no tiene más datos, envía un segmento con el indicador FIN. El servidor responde con ACK y esa mitad queda cerrada. Luego el servidor, cuando termina de enviar lo suyo, manda su propio FIN, y el cliente lo confirma con el último ACK. Son cuatro segmentos en total. Cuando todos están confirmados, la sesión termina y se liberan los recursos en ambos equipos.","accion":"Pulsar «Siguiente paso» cuatro veces.","expone":"Gabriel Galasso"},{"sec":"14.5","num":"14.5.4","min":2,"widget":"flags","titulo":"El enlace comprueba tres cosas, y seis bits lo controlan","puntos":["Comprueba que el dispositivo de destino está presente en la red.","Verifica que hay un servicio activo aceptando solicitudes en el puerto de destino.","Informa al destino que el cliente quiere establecer una sesión en ese puerto."],"notas":"El enlace de tres vías no es un trámite: cumple tres funciones. Comprueba que el destino existe en la red, verifica que hay un servicio activo escuchando en el puerto solicitado, y le avisa al destino que el cliente quiere conversar por ese puerto. Todo esto se controla con seis bits del encabezado TCP, llamados bits de control o indicadores. SYN sincroniza los números de secuencia al abrir. ACK confirma lo recibido. FIN cierra de forma ordenada. RST corta la conexión de golpe ante un error. PSH pide entregar los datos a la aplicación sin esperar, y URG marca datos urgentes. Con esto termina el proceso de comunicación; Kelvin continúa con la confiabilidad y el control de flujo.","accion":"Pulsar cada bit para leer su función. Terminar en SYN y ACK, que son los del enlace.","expone":"Gabriel Galasso"},{"sec":"14.6","num":"14.6.1","min":2,"widget":"reorder","titulo":"Los números de secuencia devuelven el orden a los datos","puntos":["Los segmentos pueden tomar rutas distintas y llegar desordenados.","Al abrir la sesión se elige un número de secuencia inicial (ISN), que es aleatorio.","El número aumenta según los bytes enviados; el receptor lo usa para reensamblar en orden."],"notas":"Pasamos a la confiabilidad. En una red, los segmentos de un mismo mensaje pueden tomar rutas diferentes y llegar en desorden. Para que la aplicación reciba los datos tal como se enviaron, cada segmento lleva un número de secuencia. Durante el enlace se fija el número de secuencia inicial, el ISN, que es prácticamente aleatorio, y a partir de ahí el número crece según la cantidad de bytes transmitidos. El receptor guarda los segmentos que llegan adelantados en un búfer y los reordena antes de entregarlos a la aplicación. En la demostración mezclo los segmentos, como haría la red, y luego TCP los ordena por su número.","accion":"Pulsar «Mezclar» y luego «Reordenar por número de secuencia».","expone":"Kelvin Del Castillo"},{"sec":"14.6","num":"14.6.3","min":2.5,"widget":"loss","titulo":"Lo que no se confirma, se retransmite","puntos":["El acuse de recibo indica el siguiente byte que el receptor espera.","Si el acuse no llega antes de que venza el temporizador, el emisor retransmite.","Con acuse selectivo (SACK), el receptor avisa qué llegó y solo se reenvía lo perdido."],"notas":"Por buena que sea la red, se pierden datos. TCP lo resuelve con números de secuencia y acuses de recibo. El acuse dice cuál es el siguiente byte que espera el receptor. Si el emisor no recibe el acuse dentro de un tiempo, retransmite. En el esquema clásico, si se envían diez segmentos y se pierden el 3 y el 4, el receptor solo puede decir «espero el 3», y el emisor reenvía del 3 al 10, aunque del 5 al 10 hubieran llegado bien. Hoy los sistemas usan acuse selectivo, SACK, que se negocia en el enlace de tres vías: el receptor confirma también los bloques que sí recibió, y el emisor retransmite únicamente el 3 y el 4.","accion":"Mostrar el caso por defecto (3 y 4 perdidos) sin SACK. Activar SACK y comparar cuántos segmentos se reenvían. Marcar otro segmento perdido si hay tiempo.","expone":"Kelvin Del Castillo"},{"sec":"14.6","num":"14.6.5","min":2,"widget":"window","titulo":"La ventana dice cuántos bytes acepta el receptor de una vez","puntos":["El tamaño de ventana es la cantidad de bytes que el destino puede recibir y procesar a la vez.","Se anuncia en el enlace de tres vías y se actualiza en cada acuse de recibo.","Ventana deslizante: el emisor sigue enviando a medida que recibe acuses, sin esperar a vaciar la ventana."],"notas":"El control de flujo evita que un emisor rápido sature a un receptor lento. El receptor anuncia un tamaño de ventana: cuántos bytes puede aceptar y procesar de una vez. El emisor no debe tener más bytes sin confirmar que ese valor. Con una ventana de 10 000 bytes y segmentos de 1 460, caben seis segmentos completos antes de tener que esperar un acuse. En la práctica el receptor va confirmando mientras procesa, y el emisor desliza la ventana y continúa enviando; por eso se llama ventana deslizante. Si el receptor se queda sin espacio, anuncia una ventana más pequeña y el emisor reduce el ritmo.","accion":"Mover el deslizador para cambiar la ventana y pulsar «Enviar ráfaga» con dos tamaños distintos.","expone":"Kelvin Del Castillo"},{"sec":"14.6","num":"14.6.6","min":1.5,"widget":"mss","titulo":"El MSS es la mayor carga de datos que cabe en un segmento","puntos":["El tamaño máximo de segmento (MSS) viaja en el campo de opciones del encabezado TCP.","Cuenta solo los datos: no incluye el encabezado TCP.","En Ethernet con IPv4: 1 500 de MTU, menos 20 de IPv4, menos 20 de TCP, da 1 460 bytes."],"notas":"El tamaño de ventana se mide en bytes, pero los datos viajan en segmentos. ¿De qué tamaño? Lo define el MSS, el tamaño máximo de segmento, que cada extremo anuncia en las opciones de TCP durante el enlace. El MSS es solo la carga de datos, sin el encabezado TCP. Su valor típico sale de una resta: la trama Ethernet admite 1 500 bytes, que es la MTU. Le quito 20 bytes del encabezado IPv4 y 20 del encabezado TCP, y quedan 1 460 bytes. Con IPv6, cuyo encabezado mide 40 bytes, el MSS baja a 1 440.","accion":"Alternar entre IPv4 e IPv6 para ver cómo cambia la resta.","expone":"Kelvin Del Castillo"},{"sec":"14.6","num":"14.6.7","min":2,"widget":"congestion","titulo":"Ante la congestión, TCP baja el ritmo por su cuenta","puntos":["Un enrutador saturado descarta paquetes, y retransmitirlos sin control empeora la congestión.","El emisor estima la congestión observando cuántos segmentos enviados quedan sin acuse.","Al detectarla reduce los bytes que envía antes de esperar un acuse, y luego vuelve a subir poco a poco."],"notas":"La ventana protege al receptor, pero la red también se puede saturar. Cuando un enrutador recibe más de lo que puede reenviar, descarta paquetes. Esos segmentos no se confirman, el emisor los retransmite, y si todos hacen lo mismo la congestión empeora. Para evitarlo, TCP usa temporizadores y algoritmos de control de congestión. El emisor observa cuántos segmentos quedan sin acuse y, cuando detecta pérdida, reduce la cantidad de bytes que envía antes de esperar confirmación. Atención: lo que reduce es su propio ritmo de envío, no el tamaño de ventana, que lo decide el destino. Después aumenta de nuevo gradualmente. El resultado es esta forma de diente de sierra, que aquí muestro simplificada. Gabriel sigue con el otro protocolo, UDP.","accion":"Dejar que la curva suba y pulsar «Provocar pérdida» dos o tres veces.","expone":"Kelvin Del Castillo"},{"sec":"14.7","num":"14.7.1","min":2,"widget":"headers","titulo":"UDP cambia confiabilidad por baja sobrecarga","puntos":["UDP no establece conexión: no hay enlace previo ni tráfico de control.","Su encabezado mide 8 bytes, frente a los 20 de TCP.","No confirma, no reordena y no retransmite; si hace falta confiabilidad, la pone la aplicación."],"notas":"Ahora el otro protocolo. UDP es un protocolo de máximo esfuerzo y sin conexión. No hay enlace de tres vías, no hay acuses, no hay ventana. Eso se ve en el encabezado: el de TCP mide 20 bytes como mínimo y lleva secuencia, acuse, indicadores y ventana. El de UDP mide solo 8 bytes y tiene cuatro campos: puerto de origen, puerto de destino, longitud y suma de comprobación. Menos encabezado y cero tráfico de control significan menos retraso. Que UDP no sea confiable no quiere decir que la aplicación no lo sea: si necesita confiabilidad, la aplicación la implementa. Por eso lo usan DNS, la voz sobre IP y el video en vivo.","accion":"Pulsar campos de ambos encabezados para leer para qué sirven; destacar los que UDP no tiene.","expone":"Gabriel Galasso"},{"sec":"14.7","num":"14.7.2","min":1.5,"widget":"udpOrder","titulo":"UDP entrega los datagramas en el orden en que llegan","puntos":["UDP no lleva números de secuencia, así que no puede reordenar.","Los datagramas se pasan a la aplicación tal como van llegando.","Si el orden importa, la aplicación debe identificar la secuencia correcta."],"notas":"Igual que con TCP, los datagramas de UDP pueden viajar por rutas distintas y llegar desordenados. La diferencia es que UDP no tiene números de secuencia, así que no tiene forma de reordenarlos. Simplemente reensambla los datos en el orden en que los recibió y los entrega a la aplicación. Y si un datagrama se pierde, UDP no se entera ni lo pide de nuevo. Si para la aplicación el orden es importante, es ella la que debe identificar la secuencia y decidir qué hacer con lo que falta.","accion":"Pulsar «Enviar 6 datagramas» dos veces para que se vea que el resultado cambia en cada envío.","expone":"Gabriel Galasso"},{"sec":"14.7","num":"14.7.3 y 14.7.4","min":2,"widget":"udpPorts","titulo":"En UDP también mandan los puertos: fijo en el servidor, dinámico en el cliente","puntos":["Servidor: la aplicación tiene un puerto bien conocido o registrado, como el 53 de DNS.","Cliente: elige al azar un puerto de origen dinámico y apunta al puerto del servidor.","La respuesta invierte los puertos, y ese mismo par se usa en toda la transacción."],"notas":"Aunque no haya conexión, UDP usa puertos igual que TCP. A las aplicaciones de servidor basadas en UDP se les asigna un puerto bien conocido o registrado; DNS usa el 53. Cuando UDP recibe un datagrama para ese puerto, entrega los datos a esa aplicación. Del lado del cliente, el proceso elige dinámicamente un puerto de origen dentro del rango de puertos dinámicos, y pone como destino el puerto del servidor. La respuesta vuelve con los puertos invertidos: origen 53 y destino el puerto que eligió el cliente. Ese mismo par se mantiene en todos los datagramas de la transacción. Cada consulta nueva puede usar un puerto de origen distinto. Kelvin cierra con la práctica y el resumen.","accion":"Recorrer la consulta y la respuesta con «Siguiente paso». Pulsar «Nueva consulta» para ver otro puerto de origen.","expone":"Gabriel Galasso"},{"sec":"14.8","num":"14.8.1","min":2,"widget":"apps","titulo":"En Packet Tracer se ve qué transporte usa cada aplicación","puntos":["En modo de simulación se filtran los eventos y se abre cada PDU para leer sus encabezados.","HTTP, FTP y el correo muestran el enlace de tres vías antes de los datos.","DNS muestra una consulta y una respuesta por UDP, sin enlace previo."],"notas":"La práctica 14.8.1 de Packet Tracer junta todo lo anterior. Se genera tráfico desde un cliente hacia un servidor con varias aplicaciones y, en modo de simulación, se abre cada PDU para ver la capa 4. Con HTTP, FTP y correo aparece primero el enlace de tres vías, con los indicadores SYN y ACK, y después los datos con sus números de secuencia y acuse. Con DNS no hay enlace: sale un datagrama UDP hacia el puerto 53 y vuelve la respuesta. También se comprueba que el puerto de origen del cliente es dinámico y que la respuesta invierte los puertos.","accion":"Pulsar HTTP y DNS para contrastar TCP y UDP; el resto si hay tiempo.","expone":"Kelvin Del Castillo"},{"sec":"14.8","num":"14.8.2","min":1.5,"widget":"compare","titulo":"TCP garantiza la entrega; UDP garantiza la rapidez","puntos":["TCP: conexión, orden, acuses, retransmisión, control de flujo y de congestión.","UDP: sin conexión, encabezado mínimo, entrega tal como llega.","La aplicación elige: exactitud con TCP, inmediatez con UDP."],"notas":"Resumiendo. TCP establece una conexión con el enlace de tres vías y la cierra con FIN y ACK. Numera los bytes para entregarlos en orden, confirma lo recibido, retransmite lo perdido, y regula el envío con la ventana y con el control de congestión. Todo eso cuesta un encabezado de 20 bytes y tráfico adicional. UDP no hace nada de eso: 8 bytes de encabezado y los datos van directo. Ninguno es mejor que el otro; la aplicación elige. Si necesito que cada byte llegue, como en una página web o un archivo, uso TCP. Si prefiero que llegue rápido aunque se pierda algo, como en una llamada, uso UDP.","accion":"Recorrer la tabla fila por fila.","expone":"Kelvin Del Castillo"},{"tipo":"quiz","sec":"14.8","num":"14.8.3","min":3,"titulo":"Comprobemos lo aprendido","notas":"Para cerrar, un cuestionario corto de seis preguntas sobre lo que acabamos de ver. Las respondemos entre todos: uno de nosotros lee la pregunta, ustedes dicen la opción y el otro la marca. La presentación indica al momento si es correcta y explica por qué.","accion":"Leer cada pregunta, pedir respuestas al grupo, marcar la opción y pulsar «Siguiente pregunta».","expone":"Ambos"},{"tipo":"cierre","sec":null,"min":1,"titulo":"¿Preguntas?","notas":"Eso es todo. La idea para llevarse es sencilla: TCP conversa antes de enviar y vigila todo lo que envía; UDP envía y confía. Muchas gracias por su atención. Quedamos atentos a sus preguntas.","accion":"Dejar esta pantalla durante las preguntas. Con la tecla G se abre el índice para volver a cualquier demostración.","expone":"Ambos"}],"quiz":[{"p":"¿Qué indicadores lleva el segundo segmento del enlace de tres vías?","o":["Solo SYN","SYN y ACK","FIN y ACK","Solo ACK"],"c":1,"e":"El servidor confirma el SYN del cliente (ACK) y abre su propio sentido de la sesión (SYN)."},{"p":"¿Cuántos segmentos se intercambian para cerrar por completo una sesión TCP?","o":["Dos","Tres","Cuatro","Seis"],"c":2,"e":"Cada sentido se cierra con un FIN y su ACK: cuatro segmentos en total."},{"p":"Un cliente recibe un segmento con SEQ = 300. ¿Qué número de acuse responde en el enlace?","o":["299","300","301","600"],"c":2,"e":"El acuse indica el siguiente byte esperado: el número recibido más uno."},{"p":"En Ethernet con IPv4, ¿cuál es el MSS habitual?","o":["1 500 bytes","1 480 bytes","1 460 bytes","1 440 bytes"],"c":2,"e":"1 500 de MTU menos 20 del encabezado IPv4 menos 20 del encabezado TCP."},{"p":"¿Qué hace UDP con los datagramas que llegan desordenados?","o":["Los reordena por número de secuencia","Pide que se retransmitan","Los descarta","Los entrega en el orden en que llegaron"],"c":3,"e":"UDP no tiene números de secuencia; el orden, si importa, lo resuelve la aplicación."},{"p":"¿Qué campo le dice al emisor cuántos bytes puede aceptar el receptor?","o":["Tamaño de ventana","Suma de comprobación","Puerto de destino","Longitud"],"c":0,"e":"El tamaño de ventana es la base del control de flujo de TCP."}],"datos":{"servicios":[["HTTP",80],["HTTPS",443],["FTP",21],["SMTP",25],["SSH",22]],"handshake":[{"d":"r","et":"SYN","sub":"SEQ = 100","txt":"El cliente solicita una sesión de cliente a servidor."},{"d":"l","et":"SYN, ACK","sub":"SEQ = 300 · ACK = 101","txt":"El servidor confirma y soli const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a)e.setAttribute(k,a[k]);c.flat().forEach(x=>e.append(x));return e;};
const s=(t,a={},...c)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);c.flat().forEach(x=>e.append(x));return e;};

const miles=n=>String(n).replace(/\B(?=(\d{3})+$)/g,' ');
const baraja=a=>{a=[...a];do{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}while(a.every((x,i)=>!i||a[i-1]<x));return a;};

const luego=(fn,ms)=>{const t=setTimeout(fn,ms);limpiar.push(()=>clearTimeout(t));};
const conmutador=(ops,fn)=>{const sw=h('div',{class:'sw'});ops.forEach((o,i)=>{const b=h('button',{type:'button','aria-pressed':i===0},o);b.onclick=()=>{[...sw.children].forEach(x=>x.setAttribute('aria-pressed',x===b));fn(i);};sw.append(b);});return sw;};

// Diagrama cliente-servidor que avanza un mensaje por clic.
function secuencia(el,pasos,o={}){
  const n=pasos.length,gap=Math.min(92,300/n),L=96,R=504,H=92+gap*n;let i=0;
  const svg=s('svg',{class:'seq',viewBox:`0 0 600 ${H}`,role:'img','aria-label':'Diagrama de intercambio entre cliente y servidor'},
    s('line',{class:'life',x1:L,y1:50,x2:L,y2:H}),s('line',{class:'life',x1:R,y1:50,x2:R,y2:H}),
    s('rect',{class:'hd',x:L-66,y:8,width:132,height:42,rx:8}),s('rect',{class:'hd',x:R-66,y:8,width:132,height:42,rx:8}));
  const t1=s('text',{x:L,y:35,'text-anchor':'middle','font-size':18,'font-weight':600});t1.textContent=o.izq||'Cliente';
  const t2=s('text',{x:R,y:35,'text-anchor':'middle','font-size':18,'font-weight':600});t2.textContent=o.der||'Servidor';
  svg.append(t1,t2);
  const msg=h('p',{class:'msg'},o.inicio||'Pulsa «Siguiente paso» para enviar el primer segmento.');
  const sig=btn('Siguiente paso',()=>{
    const p=pasos[i],y=78+gap*i,x1=p.d==='r'?L:R,x2=p.d==='r'?R:L,y2=y+30,ang=Math.atan2(30,x2-x1)*180/Math.PI;
    const g=s('g',{},s('line',{class:'ar',pathLength:1,x1,y1:y,x2,y2}),s('path',{class:'tip',d:'M-15,-8 L0,0 L-15,8 z',transform:`translate(${x2},${y2}) rotate(${ang})`}));
    const a=s('text',{class:'lb et',x:300,y:y+4,'text-anchor':'middle'});a.textContent=p.et;
    const b=s('text',{class:'lb sub',x:300,y:y+44,'text-anchor':'middle'});b.textContent=p.sub;
    g.append(a,b);svg.append(g);msg.textContent=`${i+1}. ${p.txt}`;
    if(++i===n){sig.disabled=true;msg.classList.add('good');}
  });
  el.append(svg,msg,h('div',{class:'row'},sig,btn(o.otra||'Reiniciar',o.reiniciar||(()=>{el.innerHTML='';secuencia(el,pasos,o);}),'ghost')));
}

const W={
  ports(el){
    const msg=h('p',{class:'msg'},'Enciende un servicio para abrir su puerto.');
    const g=h('div',{class:'ports'}),abiertos=new Set();
    D.datos.servicios.forEach(([n,p])=>{
      const st=h('span',{class:'st'},'cerrado');
      const b=h('button',{class:'port',type:'button','aria-pressed':'false','data-p':p},h('span',{class:'pn'},String(p)),h('span',{},n),st);
      b.onclick=()=>{const a=!abiertos.has(p);a?abiertos.add(p):abiertos.delete(p);b.setAttribute('aria-pressed',a);st.textContent=a?'abierto':'cerrado';
        msg.className='msg';msg.textContent=a?`${n} escucha en el puerto ${p}: el puerto está abierto y acepta segmentos.`:`${n} se detuvo: el puerto ${p} quedó cerrado.`;};
      g.append(b);
    });
    const dup=btn('Iniciar un segundo servidor web en el 80',()=>{

      const b=g.querySelector('[data-p="80"]');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
    },'ghost');
    el.append(h('p',{class:'hh'},h('b',{},'Servidor 10.93.87.10'),h('span',{},'TCP')),g,h('div',{class:'grow'}),msg,h('div',{class:'row'},dup));
  },

    el.append(h('p',{class:'hh'},h('b',{},'Bits de control del encabezado TCP'),h('span',{},'6 bits')),g,nom,msg,h('div',{class:'grow'}),

    const segs=[0,1,2,3,4,5].map(i=>{const e=h('div',{class:'seg'},h('b',{},'Seg '+(i+1)),h('span',{},'SEQ '+(1+i*1460)));tr.append(e);return e;});
    const pon=o=>o.forEach((k,pos)=>segs[k].style.left=pos*92+'px');pon([0,1,2,3,4,5]);
    el.append(h('p',{class:'hh'},h('b',{},'Búfer de recepción'),h('span',{},'ISN = 1')),tr,h('div',{class:'grow'}),msg,h('div',{class:'row'},
      btn('Mezclar',()=>{pon(baraja([0,1,2,3,4,5]));msg.className='msg';msg.textContent='La red los entregó por rutas distintas: llegaron desordenados.';}),
      btn('Reordenar por número de secuencia',()=>{pon([0,1,2,3,4,5]);msg.className='msg good';msg.textContent='TCP los ordena por su número de secuencia antes de pasarlos a la aplicación.';},'ghost')));
  },
  loss(el){
    const perdidos=new Set([3,4]);let sack=false;
    const env=h('div',{class:'cells'}),ret=h('div',{class:'cells'}),msg=h('p',{class:'msg'});
    const pinta=()=>{
      const pri=Math.min(...perdidos),re=[];env.innerHTML='';ret.innerHTML='';
      for(let i=1;i<=10;i++){
        const b=h('button',{class:'cell'+(perdidos.has(i)?' lost':''),type:'button','aria-label':`Segmento ${i}${perdidos.has(i)?', perdido':''}`},String(i));
        b.onclick=()=>{perdidos.has(i)?perdidos.delete(i):perdidos.add(i);pinta();};env.append(b);
        const r=perdidos.size&&(sack?perdidos.has(i):i>=pri);if(r)re.push(i);
        ret.append(h('div',{class:'cell '+(r?'re':'off')},String(i)));
      }
      if(!perdidos.size){msg.textContent='Todo llegó. El receptor responde ACK = 11 y no se retransmite nada.';return;}
      msg.textContent=sack
        ?`El receptor responde ACK = ${pri} y además informa qué bloques sí recibió. Se retransmiten ${re.length}: solo los perdidos.`
        :`El receptor solo puede decir ACK = ${pri} («espero el ${pri}»). Se retransmiten ${re.length} segmentos: del ${pri} al 10.`;
    };
    el.append(h('div',{class:'row'},conmutador(['Acuse acumulativo','Acuse selectivo (SACK)'],i=>{sack=!!i;pinta();})),
      h('p',{class:'cap'},'Enviados. Pulsa un segmento para perderlo o recuperarlo.'),env,h('p',{class:'cap'},'Retransmitidos'),ret,h('div',{class:'grow'}),msg);
    pinta();
  },

    const a=h('b'),b=h('b'),c=h('b',{},'1'),lane=h('div',{class:'lane'},h('div',{class:'end'},'Emisor'),h('div',{class:'end r'},'Receptor'));
    const msg=h('p',{class:'msg'});
    const calc=()=>{const n=Math.floor(rng.value/MSS);a.textContent=miles(rng.value);b.textContent=n;
      msg.className='msg';msg.textContent=`Con esta ventana caben ${n} segmentos completos (${miles(n*MSS)} bytes) antes de esperar un acuse.`;return n;};
    rng.oninput=calc;
    const env=btn('Enviar ráfaga',()=>{if(ocupado)return;ocupado=true;env.disabled=true;const n=calc(),w=lane.clientWidth-226;
      for(let i=0;i<n;i++){const p=h('div',{class:'pk'});lane.append(p);
        p.animate([{opacity:1,transform:'translateX(0)'},{opacity:1,transform:`translateX(${w}px)`}],{duration:700,delay:i*130,fill:'forwards',easing:'ease-in-out'});}
      luego(()=>{conf+=n*MSS;const k=h('div',{class:'pk ack'},'ACK '+(conf+1));lane.append(k);
        k.animate([{opacity:1,transform:'translateX(0)'},{opacity:1,transform:`translateX(${-w+60}px)`}],{duration:700,fill:'forwards',easing:'ease-in-out'});},700+n*130);
      luego(()=>{lane.querySelectorAll('.pk').forEach(x=>x.remove());c.textContent=miles(conf+1);
        msg.className='msg good';msg.textContent=`El receptor confirmó ${miles(n*MSS)} bytes. La ventana se desliza y el emisor puede continuar.`;ocupado=false;env.disabled=false;},1500+n*130);
    });
    el.append(h('p',{class:'cap'},'Tamaño de ventana que anuncia el receptor'),rng,
      h('div',{class:'stat'},h('div',{},a,h('span',{},'bytes de ventana')),h('div',{},b,h('span',{},'segmentos por ráfaga')),h('div',{},c,h('span',{},'próximo byte a enviar'))),
      lane,h('div',{class:'grow'}),msg,h('div',{class:'row'},env));
    calc();
  },
  mss(el){
    const ip=h('div',{class:'ip'}),da=h('div',{class:'da'}),eq=h('p',{class:'big mono'}),msg=h('p',{class:'msg'});
    const pon=v6=>{const e=v6?40:20,m=1500-e-20;ip.className='ip'+(v6?' v6':'');
      ip.replaceChildren(h('b',{},String(e)),v6?'IPv6':'IPv4');da.replaceChildren(h('b',{},miles(m)),'Datos: el MSS');
      eq.textContent=`1 500 − ${e} − 20 = ${miles(m)}`;
      msg.textContent=v6?'El encabezado IPv6 mide 40 bytes, así que queda menos espacio para los datos.':'Valor habitual en Ethernet: es el MSS que anuncian casi todos los equipos.';};
    el.append(h('div',{class:'row'},conmutador(['IPv4','IPv6'],pon)),h('p',{class:'cap'},'MTU de Ethernet: 1 500 bytes (no está a escala)'),h('div',{class:'brace'}),
      h('div',{class:'mtu'},ip,h('div',{class:'th'},h('b',{},'20'),'TCP'),da),eq,h('div',{class:'grow'}),msg);
    pon(0);
  },
  congestion(el){
    let cw=1,pts=[],marcas=[];const N=46,pl=s('polyline'),g=s('g');
    const svg=s('svg',{class:'cg',viewBox:'0 0 600 320',role:'img','aria-label':'Gráfica del ritmo de envío en el tiempo'},
      s('line',{class:'ax',x1:40,y1:20,x2:40,y2:290}),s('line',{class:'ax',x1:40,y1:290,x2:590,y2:290}),pl,g);
    const tx=s('text',{x:46,y:22});tx.textContent='Bytes enviados antes de esperar un acuse';
    const tt=s('text',{x:590,y:312,'text-anchor':'end'});tt.textContent='Tiempo';svg.append(tx,tt);
    const msg=h('p',{class:'msg'},'Sin pérdidas, el emisor aumenta poco a poco lo que envía.');
    const cae=auto=>{cw=Math.max(1,Math.floor(cw/2));marcas.push(pts.length);
      msg.className='msg bad';msg.textContent=auto?'La red llegó a su límite y descartó segmentos: el emisor reduce el envío a la mitad.':'Segmentos sin acuse: el emisor asume congestión y reduce el envío a la mitad.';};
    const tick=()=>{if(cw>=20)cae(true);else cw++;pts.push(cw);
      if(pts.length>N){pts.shift();marcas=marcas.map(m=>m-1).filter(m=>m>=0);}
      const X=i=>40+i*12,Y=v=>290-v*12.5;
      pl.setAttribute('points',pts.map((v,i)=>X(i)+','+Y(v)).join(' '));
      g.replaceChildren(...marcas.filter(m=>m<pts.length).map(m=>s('circle',{cx:X(m),cy:Y(pts[m]),r:6})));};
    const t=setInterval(tick,330);limpiar.push(()=>clearInterval(t));tick();
    el.append(svg,msg,h('div',{class:'row'},btn('Provocar pérdida',()=>{cae(false);}),h('span',{class:'cap'},'Modelo simplificado')));
  },
  headers(el){
    const msg=h('p',{class:'msg'},'Pulsa un campo para ver para qué sirve.');let todos=[];
    const arma=(campos,c)=>{const g=h('div',{class:'hdr '+c});campos.forEach(([n,bits,t])=>{
      const b=h('button',{type:'button',style:`grid-column:span ${bits}`,'aria-pressed':'false',title:n},n);todos.push(b);
      b.onclick=()=>{todos.forEach(x=>x.setAttribute('aria-pressed',x===b));msg.textContent=`${n} (${bits} bits). ${t}`;};g.append(b);});return g;};
    el.append(h('p',{class:'hh tcp'},h('b',{},'Encabezado TCP'),h('span',{},'20 bytes')),arma(D.datos.tcpCampos,'tcp'),
      h('p',{class:'hh udp'},h('b',{},'Encabezado UDP'),h('span',{},'8 bytes')),arma(D.datos.udpCampos,'udp'),h('div',{class:'grow'}),msg);
  },
  udpOrder(el){
    const env=h('div',{class:'cells'}),rec=h('div',{class:'cells'}),msg=h('p',{class:'msg'},'Seis datagramas listos para salir. UDP no los numera.');
    for(let i=1;i<=6;i++)env.append(h('div',{class:'cell'},String(i)));
    env.style.gridTemplateColumns=rec.style.gridTemplateColumns='repeat(6,1fr)';
    el.append(h('p',{class:'cap'},'Enviados por el emisor'),env,h('p',{class:'cap'},'Entregados a la aplicación, en orden de llegada'),rec,h('div',{class:'grow'}),msg,
      h('div',{class:'row'},btn('Enviar 6 datagramas',()=>{
        let o=baraja([1,2,3,4,5,6]);const pierde=Math.random()<.5?o.pop():0;rec.innerHTML='';
        o.forEach((n,i)=>rec.append(h('div',{class:'cell re in',style:`animation-delay:${i*180}ms`},String(n))));
        msg.className='msg';msg.textContent=`La aplicación recibe ${o.join(', ')}. `+(pierde?`El datagrama ${pierde} se perdió y UDP no lo reclama.`:'Llegaron todos, pero UDP no corrige el orden.');
      })));
  },
  udpPorts(el){
    const p=49152+Math.floor(Math.random()*16384);
    secuencia(el,[
      {d:'r',et:'Consulta DNS',sub:`origen ${p} → destino 53`,txt:`El cliente eligió al azar el puerto de origen ${p} y envía al puerto 53 del servidor DNS.`},
      {d:'l',et:'Respuesta DNS',sub:`origen 53 → destino ${p}`,txt:'El servidor responde invirtiendo los puertos. No hubo enlace previo ni habrá cierre.'},
    ],{der:'Servidor DNS',inicio:'UDP no abre conexión: el primer datagrama ya lleva la consulta.',otra:'Nueva consulta',reiniciar:()=>{el.innerHTML='';W.udpPorts(el);}});
  },
  apps(el){
    const card=h('div',{class:'card grow'});
    const pon=i=>{const [n,t,p,d]=D.datos.apps[i],udp=t==='UDP';card.className='card grow '+(udp?'udp':'tcp');
      card.replaceChildren(h('p',{class:'big'},`${t}, puerto ${p}`),h('p',{class:'msg'},d),h('p',{class:'cap'},'Lo que aparece en la lista de eventos:'),
        h('div',{class:'chips'},(udp?['Consulta','Respuesta']:['SYN','SYN, ACK','ACK','Datos','FIN','ACK']).map((x,k)=>h('span',{style:`animation-delay:${k*90}ms`},x))));};
    el.append(h('div',{class:'row'},conmutador(D.datos.apps.map(a=>a[0]),pon)),card);pon(0);
  },
  compare(el){
    el.append(h('table',{},h('thead',{},h('tr',{},h('th',{},''),h('th',{},'TCP'),h('th',{},'UDP'))),
      h('tbody',{},D.datos.comparar.map(r=>h('tr',{},r.map(c=>h('td',{},c)))))));
  },
};

function cuestionario(el){
  let i=0,ok=0;
  const pinta=()=>{
    el.innerHTML='';
    if(i===D.quiz.length){el.append(h('p',{class:'big'},`Resultado: ${ok} de ${D.quiz.length}`),
      h('p',{class:'msg'},ok===D.quiz.length?'Todo correcto: el módulo 14 quedó claro.':'Las demostraciones anteriores sirven para repasar las que fallaron (tecla G para ir al índice).'),
      h('div',{class:'row'},btn('Repetir el cuestionario',()=>{i=0;ok=0;pinta();})));return;}
    const q=D.quiz[i],msg=h('p',{class:'msg'}),sig=btn(i===D.quiz.length-1?'Ver resultado':'Siguiente pregunta',()=>{i++;pinta();});sig.disabled=true;
    const ops=h('div',{class:'opts'},q.o.map((t,k)=>{const b=h('button',{class:'opt',type:'button'},t);
      b.onclick=()=>{[...ops.children].forEach((x,j)=>{x.disabled=true;if(j===q.c)x.classList.add('yes');});
        if(k===q.c){ok++;msg.className='msg good';msg.textContent='Correcto. '+q.e;}else{b.classList.add('no');msg.className='msg bad';msg.textContent='No es esa. '+q.e;}
        sig.disabled=false;};return b;}));
    el.append(h('p',{class:'where'},`Pregunta ${i+1} de ${D.quiz.length}`),h('h3',{},q.p),ops,msg,h('div',{class:'row'},sig));
  };
  pinta();
}

// ---------- armado de diapositivas ----------
const stage=document.getElementById('stage'),bar=document.getElementById('bar'),secDe=id=>D.secciones.find(x=>x.id===id);
const els=D.slides.map((sl,i)=>{
  const sec=secDe(sl.sec),e=h('section',{class:'slide '+(sec?sec.color:'tcp'),'aria-label':sl.titulo});
  if(sl.tipo==='portada')e.append(h('div',{class:'cover'},h('h1',{},h('span',{class:'tcpw'},'TCP'),' y ',h('span',{class:'udpw'},'UDP'),h('br'),'en acción'),
    h('p',{},D.meta.subtitulo),h('div',{class:'gente'},D.meta.expositores.map(x=>h('div',{},h('img',{src:D.fotos[x.foto],alt:'Foto de '+x.nombre}),h('span',{},x.nombre,h('small',{},'Matrícula '+x.matricula)))))),
    h('div',{class:'wire','aria-hidden':'true'},h('i',{},'SYN'),h('i',{},'SYN, ACK'),h('i',{},'ACK')));
  else if(sl.tipo==='agenda')e.append(h('h2',{},sl.titulo),h('div',{class:'agenda'},D.secciones.map(sc=>{
    const mias=D.slides.filter(x=>x.sec===sc.id),b=h('button',{type:'button',class:sc.color},h('b',{},sc.id),h('span',{},sc.nombre),
      h('small',{},`${mias.length} ${mias.length===1?'diapositiva':'diapositivas'}, unos ${Math.round(mias.reduce((a,x)=>a+x.min,0))} minutos`));
    b.onclick=()=>ir(D.slides.findIndex(x=>x.sec===sc.id));return b;})));
  else if(sl.tipo==='quiz')e.append(h('p',{class:'where'},h('b',{},sl.num),sec.nombre),h('h2',{},sl.titulo),h('div',{class:'quiz','data-w':'quiz'}));
  else if(sl.tipo==='cierre')e.append(h('div',{class:'fin'},h('h2',{},sl.titulo),h('p',{},'TCP conversa antes de enviar y vigila todo lo que envía. UDP envía y confía.'),
    h('p',{class:'who'},`${D.meta.autores}. ${D.meta.curso}`)));
  else e.append(h('div',{class:'cols'},h('div',{},h('p',{class:'where'},h('b',{},sl.num),sec.nombre),h('h2',{},sl.titulo),h('ul',{class:'pts'},sl.puntos.map(p=>h('li',{},p)))),
    h('div',{class:'w','data-w':sl.widget})));
  stage.insertBefore(e,bar);return e;
});
const idx=document.getElementById('index'),notes=document.getElementById('notes');
D.slides.forEach((sl,i)=>{const b=h('button',{type:'button'},(sl.num?sl.num+'  ':'')+sl.titulo);b.onclick=()=>{idx.classList.remove('on');ir(i);};idx.querySelector('ol').append(h('li',{},b));});

let cur=-1;
function ir(n){
  n=Math.max(0,Math.min(els.length-1,n));if(n===cur)return;
  limpiar.forEach(f=>f());limpiar=[];
  if(cur>=0)els[cur].classList.remove('on');cur=n;const e=els[n],sl=D.slides[n],w=e.querySelector('[data-w]');
  if(w){w.innerHTML='';w.dataset.w==='quiz'?cuestionario(w):W[w.dataset.w](w);}
  e.classList.add('on');
  const sec=secDe(sl.sec);document.getElementById('sec').textContent=sec?sec.id+' '+sec.nombre:D.meta.curso;
  document.getElementById('count').textContent=`${n+1} / ${els.length}`;
  document.getElementById('dot').style.left=(n/(els.length-1)*100)+'%';
  notes.replaceChildren(h('b',{},'Expone: '+sl.expone+'. '),sl.notas,h('em',{},'En pantalla: '+sl.accion));
  history.replaceState(null,'','#'+(n+1));
}
document.getElementById('prev').onclick=()=>ir(cur-1);
document.getElementById('next').onclick=()=>ir(cur+1);
addEventListener('keydown',e=>{
  const t=e.target,k=e.key;
  if(t.tagName==='INPUT')return;
  if(t.tagName==='BUTTON'&&(k===' '||k==='Enter'))return;
  if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();ir(cur+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();ir(cur-1);}
  else if(k==='Home')ir(0);else if(k==='End')ir(els.length-1);
  else if(k==='n'||k==='N')notes.classList.toggle('on');
  else if(k==='g'||k==='G')idx.classList.toggle('on');
  else if(k==='Escape'){idx.classList.remove('on');notes.classList.remove('on');}
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});
let tx0=null;
addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;},{passive:true});
addEventListener('touchend',e=>{if(tx0===null)return;const d=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(d)>70&&!e.target.closest('.w,.quiz'))ir(cur+(d<0?1:-1));});
const escala=()=>{stage.style.transform=`scale(${Math.min(innerWidth/1280,innerHeight/720)})`;};
addEventListener('resize',escala);escala();
ir((parseInt(location.hash.slice(1))||1)-1);

// Autocomprobación: abrir con ?test recorre cada diapositiva y pulsa todos sus controles.
if(location.search.includes('test')){
  const errs=[];onerror=m=>{errs.push(m);};
  try{
    els.forEach((e,i)=>{ir(i);for(let r=0;r<3;r++)e.querySelectorAll('[data-w] button:not(:disabled)').forEach(b=>{if(b.isConnected)b.click();});
      const w=e.querySelector('[data-w]');if(w&&!w.children.length)errs.push('vacía: '+i);});
    console.assert(miles(10000)==='10 000');if(miles(10000)!=='10 000')errs.push('miles');
  }catch(x){errs.push(String(x&&x.stack||x));}
  const k=+new URLSearchParams(location.search).get('test'); // ?test=N deja la diapositiva N con sus controles pulsados una vez
  if(k){ir(0);ir(k-1);els[k-1].querySelectorAll('[data-w] button:not(:disabled):not(.ghost)').forEach(b=>{if(b.isConnected)b.click();});}
  document.body.append(h('pre',{id:'test',style:'position:fixed;left:8px;top:4px;margin:0;z-index:9;color:#fff;background:#000;font-size:13px'},errs.length?'TEST FALLA\n'+errs.join('\n'):`TEST OK ${els.length} diapositivas`));
}
