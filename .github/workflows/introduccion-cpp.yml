name: Introduccion - C++ en Windows

on:
  push:
    branches: [main]
    paths:
      - '00-introduccion-a-la-algoritmia/**'
      - '.github/workflows/introduccion-cpp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compilar y probar los siete programas
        shell: pwsh
        run: ./00-introduccion-a-la-algoritmia/tests/Run-Tests.ps1
